[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["examples/idp-proto"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
transit-async-io = { path = "crates/transit-async-io" }
transit-client = { path = "crates/transit-client" }
transit-core = { path = "crates/transit-core" }
transit-ffi = { path = "crates/transit-ffi" }
transit-macros = { path = "crates/transit-macros" }
transit-rt = { path = "crates/transit-rt" }
transit-server = { path = "crates/transit-server" }
transit-tcp = { path = "crates/transit-tcp" }
transit-tls = { path = "crates/transit-tls" }
transit-tokio = { path = "crates/transit-tokio" }
transit-wasm = { path = "crates/transit-wasm" }
transit-ws = { path = "crates/transit-ws" }

bitcode = "0.6.9"
futures = "0.3.34"
hex = "0.4.3"
snafu = "0.9.2"
tracing = "0.1.44"
uniffi = "0.32.2"
