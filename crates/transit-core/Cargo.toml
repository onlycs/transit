[package]
name = "transit-core"
version.workspace = true
edition.workspace = true

[features]
default = ["stable"]
nightly = ["snafu/unstable-provider-api"]
unstable = ["nightly", "transit-reflect/unstable", "transit-macros/unstable"]
uniffi = ["dep:uniffi"]
wasm = [
    "getrandom/wasm_js",
    "dep:wasm-bindgen",
    "dep:tsify",
    "dep:serde",
    "futures-not-send",
]
futures-not-send = ["transit-rt/futures-not-send"]
stable = ["dep:type-signature", "transit-reflect/stable"]

[dependencies]
bilge = "0.5.0"
bitcode.workspace = true
futures.workspace = true
getrandom = "0.4.3"
hex.workspace = true
snafu.workspace = true
tracing.workspace = true
transit-reflect = { workspace = true, default-features = false }
transit-rt.workspace = true
transit-macros.workspace = true
type-signature = { version = "0.1.3", optional = true }

uniffi = { workspace = true, optional = true }

serde = { version = "1", features = ["derive"], optional = true }
tsify = { version = "0.5.8", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
